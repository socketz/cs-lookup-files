[project]
name = "cs-lookup-files"
version = "0.1.0"
description = "Aggregate free threat-intel feeds into CrowdStrike Falcon lookup files"
readme = "README.md"
authors = [
    { name = "socketz", email = "socketz@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "polars>=1.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "typer>=0.12",
]

[project.scripts]
cs-lookup-files = "cs_lookup_files:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
files = ["src/cs_lookup_files"]

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "polars.*",
    "typer.*",
    "httpx.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_unimported = false
check_untyped_defs = false
