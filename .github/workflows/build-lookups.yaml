name: Build Lookups

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-lookups
  cancel-in-progress: true

env:
  # Secrets enter via env vars only; never committed in config/sources.yaml.
  ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
  OTX_API_KEY: ${{ secrets.OTX_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Comfortable margin over the <30 min objective and far from the 6h job cap.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Setup Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest tests -q

      - name: Compute cache key
        id: cachekey
        # Per-day key: keeps the cache store bounded (Free tier: 10 GB/repo)
        # instead of creating one entry per run. restore-keys picks the newest.
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore HTTP + ip2asn cache
        uses: actions/cache@v6
        with:
          path: cache
          key: lookups-cache-${{ runner.os }}-${{ steps.cachekey.outputs.date }}
          restore-keys: |
            lookups-cache-${{ runner.os }}-

      - name: Fetch previous state
        # Missing state (first run) is tolerated: the source is published with
        # empty history and a 404 is expected.
        run: |
          mkdir -p state
          curl -fsSL \
            -o state/state.json \
            "https://github.com/${{ github.repository }}/releases/latest/download/state.json" \
            || echo "no previous state; starting fresh"

      - name: Build lookup files
        run: |
          uv run cs-lookup-files build \
            --config-dir config \
            --output-dir output \
            --state state/state.json \
            --cache-dir cache

      - name: Verify build produced lookup datasets
        # Empty datasets are omitted from the release, so a run where every
        # dataset is pruned would still upload metadata/state. Publishing that
        # would replace the stable `latest` URLs with 404s; fail the build so
        # publish-release never runs.
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          meta = json.loads(Path("output/metadata.json").read_text())
          total = sum(int(v) for v in meta.get("ioc_counts", {}).values())
          datasets = sorted(p.name for p in Path("output").glob("malicious_*.csv"))
          if total <= 0 or not datasets:
              print("::error::build produced no lookup datasets; refusing to publish")
              sys.exit(1)
          print(f"datasets={len(datasets)} indicators={total}")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lookup-files
          # Globs (not an explicit list): datasets with zero rows are omitted
          # from the release so files may legitimately be absent.
          path: |
            output/*.csv
            output/*.json
          if-no-files-found: error
          # The publish job downloads immediately; 1 day keeps the Free
          # tier artifact budget (500 MB) far below the limit.
          retention-days: 1